{% extends "companyhome.html" %}
{% block title %}Edit Company Profile {% endblock %}
{% block content %}
<a href="/company_profile/{{company.id}}" style="text-decoration: none;">
    <div class="backbutton"
        style="display: flex;justify-content: center;align-items: center; font-family: lexend;font-size: 1.7vh;font-weight: 400; height: 4vh; width: 9vh; background-color: #181818; color: #ffffff; position: absolute;top: 15vh;left: 7vh; border-radius: 1vh;">
        Back</div>
</a>

<div class="d-flex justify-content-center align-items-center mt-5">
    <div class="p-4 mt-4 rounded-3"
        style="width: 65%;background-color: rgb(246, 243, 243);box-shadow: 0vh 0vh 0.2vh 0vh #181818">
        <p class="text-center mb-4" style=" font-family:Lexend;font-size: 4.5vh;font-weight: 550;">
            Edit Company Details </p>
        <form method="post" class="row g-3">
            <div class="col-md-6 mb-4">
                <label class="form-label">
                    <p
                        style="font-family: lexend; font-size: 1.5vh;font-weight: 700;margin-left: -0.3vh; margin-bottom: 1.3vh;">
                        Name</p>
                </label>
                <input type="text" name="company" value="{{company.company}}" class="form-control"
                    style="background-color:rgb(229, 229, 229);color: #262626;font-weight: 400;font-family: Lexend;"
                   minlength="2" maxlength="150" required>
            </div>
            <div class="col-md-3 mb-4">
                <label class="form-label">
                    <p
                        style="font-family: lexend; font-size: 1.5vh;font-weight: 700;margin-left: -0.3vh;margin-bottom: 1.3vh;">
                        Location</p>
                </label>
                <input type="text" name="location" value="{{company.location}}" class="form-control"
                    style="background-color:rgb(229, 229, 229);color: #262626;font-weight: 400;font-family: Lexend;"
                   minlength="2" maxlength="100" required>
            </div>
            <div class="col-md-3 mb-4">
                <label class="form-label">
                    <p
                        style="font-family: lexend; font-size: 1.5vh;font-weight: 700;margin-left: -0.3vh;margin-bottom: 1.3vh;">
                        HR Contact</p>
                </label>
                <input type="text" name="hrcontact" value="{{company.hrcontact}}" class="form-control"
                    style="background-color:rgb(229, 229, 229);color: #262626;font-weight: 400;font-family: Lexend;"
                   minlength="7" maxlength="20" required>
            </div>
            <div class="col-md-4 mb-4">
                <label class="form-label">
                    <p
                        style="font-family: lexend; font-size: 1.5vh;font-weight: 700;margin-left: -0.3vh;margin-bottom: 1.3vh;">
                        Website</p>
                </label>
                <input type="url" name="website" value="{{company.website}}" class="form-control"
                    style="background-color:rgb(229, 229, 229);color: #262626;font-weight: 400;font-family: Lexend;"
                   minlength="5" maxlength="255" required>
            </div>
            <div class="col-md-4 mb-4">
                <label class="form-label">
                    <p
                        style="font-family: lexend; font-size: 1.5vh;font-weight: 700;margin-left: -0.3vh;margin-bottom: 1.3vh;">
                        Company Type</p>
                </label>
                <select name="companytype" class="form-control"
                    style="background-color:rgb(229, 229, 229);color: #262626;font-weight: 400;font-family:Lexend;">
                    {% if company.companytype=="Private Limited" %}
                    <option value="Private Limited" selected>Private Limited</option>
                    <option value="Public Limited">Public Limited</option>
                    <option value="PSU">PSU</option>
                    <option value="MNC">MNC</option>
                    <option value="Startup">Startup</option>
                    <option value="Partnership">Partnership</option>
                    {% elif company.companytype=="Public Limited" %}
                    <option value="Private Limited">Private Limited</option>
                    <option value="Public Limited" selected>Public Limited</option>
                    <option value="PSU">PSU</option>
                    <option value="MNC">MNC</option>
                    <option value="Startup">Startup</option>
                    <option value="Partnership">Partnership</option>
                    {% elif company.companytype=="PSU" %}
                    <option value="Private Limited">Private Limited</option>
                    <option value="Public Limited">Public Limited</option>
                    <option value="PSU" selected>PSU</option>
                    <option value="MNC">MNC</option>
                    <option value="Startup">Startup</option>
                    <option value="Partnership">Partnership</option>
                    {% elif company.companytype=="MNC" %}
                    <option value="Private Limited">Private Limited</option>
                    <option value="Public Limited">Public Limited</option>
                    <option value="PSU">PSU</option>
                    <option value="MNC" selected>MNC</option>
                    <option value="Startup">Startup</option>
                    <option value="Partnership">Partnership</option>
                    {% elif company.companytype=="Startup" %}
                    <option value="Private Limited">Private Limited</option>
                    <option value="Public Limited">Public Limited</option>
                    <option value="PSU">PSU</option>
                    <option value="MNC">MNC</option>
                    <option value="Startup" selected>Startup</option>
                    <option value="Partnership">Partnership</option>
                    {% else %}
                    <option value="Private Limited">Private Limited</option>
                    <option value="Public Limited">Public Limited</option>
                    <option value="PSU">PSU</option>
                    <option value="MNC">MNC</option>
                    <option value="Startup">Startup</option>
                    <option value="Partnership" selected>Partnership</option>
                    {% endif %}
                </select>
            </div>
            <div class="col-md-4 mb-4">
                <label class="form-label">
                    <p
                        style="font-family: lexend; font-size: 1.5vh;font-weight: 700;margin-left: -0.3vh;margin-bottom: 1.3vh;">
                        Product & Services</p>
                </label>
                <select name="ps" class="form-control"
                    style="background-color:rgb(229, 229, 229);color: #262626;font-weight: 400;font-family: Lexend;">
                    {% if company.ps=="Product-Based" %}
                    <option value="Product-Based" selected>Product-Based</option>
                    <option value="Service-Based">Service-Based</option>
                    <option value="Hybrid">Hybrid</option>
                    {% elif company.ps=="Service-Based" %}
                    <option value="Product-Based">Product-Based</option>
                    <option value="Service-Based" selected>Service-Based</option>
                    <option value="Hybrid">Hybrid</option>
                    {% else %}
                    <option value="Product-Based">Product-Based</option>
                    <option value="Service-Based">Service-Based</option>
                    <option value="Hybrid" selected>Hybrid</option>
                    {% endif %}
                </select>
            </div>
            <div class="col-md-6 mb-4">
                <label class="form-label">
                    <p
                        style="font-family: lexend; font-size: 1.5vh;font-weight: 700;margin-left: -0.3vh;margin-bottom: 1.3vh;">
                        Email</p>
                </label>
                <input type="email" name="email" value="{{company.email}}" class="form-control"
                    style="background-color:rgb(229, 229, 229);color: #262626;font-weight: 400;font-family: Lexend;"
                   minlength="7" maxlength="50" required>
            </div>
            <div class="col-md-6 mb-4">
                <label class="form-label">
                    <p
                        style="font-family: lexend; font-size: 1.5vh;font-weight: 700;margin-left: -0.3vh;margin-bottom: 1.3vh;">
                        Password</p>
                </label>
                <input type="password" name="password" value="{{company.password}}" class="form-control"
                    style="background-color:rgb(229, 229, 229);color: #262626;font-weight: 400;font-family: Lexend;"
                   minlength="8" maxlength="15" required>
            </div>

            <div class="text-center viewbutton">
                <button type="submit" class="btn btn-dark"
                    style="width: 50vh;height: 7vh;font-family: Lexend;font-weight: 600;font-size: 2.5vh;">Update
                    Changes</button>
            </div>
        </form>
    </div>
    {% endblock %}
