{% extends "admin_dashboard.html" %}
{% block title %} Student Details {% endblock %}
{% block content %}

<div class="body"
    style="width: 15vh;height: 3.3vh;display: flex; align-items: center; justify-content: center;background: #181818;position: absolute;top: 20.8vh; left:30vh;rotate: -23deg; box-shadow: 0vh 0vh 0.2vh 0vh #181818;">
    <p class="title" style="font-family: lexend; font-size: 1.4vh;font-weight: 600; color: #ffffff;">Student Details</p>
</div>

<div class="d-flex justify-content-center align-items-center mt-5">
    <div class="p-4 mt-4 rounded-3"
        style="width: 65%;background-color: rgb(246, 243, 243);box-shadow: 0vh 0vh 0.2vh 0vh #181818">
        <p class="text-center mb-4" style=" font-family:Lexend;font-size: 4.5vh;font-weight: 550;margin-bottom: 6vh;">
            {{student.name| upper}} </p>
        <form method="post" class="row g-3">
            <div class="col-md-6 mb-3">
                <label class="form-label">
                    <p
                        style="font-family: lexend; font-size: 1.5vh;font-weight: 700;margin-left: -0.3vh; margin-bottom: 1.3vh;">
                        Gender</p>
                </label>
                <input value="{{student.gender}}" class="form-control"
                    style="background-color:rgb(229, 229, 229);color: #262626;font-weight: 450;font-family: Lexend;"
                    disabled>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">
                    <p
                        style="font-family: lexend; font-size: 1.5vh;font-weight: 700;margin-left: -0.3vh;margin-bottom: 1.3vh;">
                        Date of Birth</p>
                </label>
                <input value="{{student.dob}}" class="form-control"
                    style="background-color:rgb(229, 229, 229);color: #262626;font-weight: 450;font-family: Lexend;"
                    disabled>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">
                    <p
                        style="font-family: lexend; font-size: 1.5vh;font-weight: 700;margin-left: -0.3vh;margin-bottom: 1.3vh;">
                        Linkedin</p>
                </label>
                <input value="{{student.linkedin}}" class="form-control"
                    style="background-color:rgb(229, 229, 229);color: #262626;font-weight: 450;font-family: Lexend;"
                    disabled>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">
                    <p
                        style="font-family: lexend; font-size: 1.5vh;font-weight: 700;margin-left: -0.3vh;margin-bottom: 1.3vh;">
                        Email</p>
                </label>
                <input value="{{student.email}}" class="form-control"
                    style="background-color:rgb(229, 229, 229);color: #262626;font-weight: 450;font-family: Lexend;"
                    disabled>
            </div>
            <div class="col-md-5 mb-3">
                <label class="form-label">
                    <p
                        style="font-family: lexend; font-size: 1.5vh;font-weight: 700;margin-left: -0.3vh;margin-bottom: 1.3vh;">
                        Department</p>
                </label>
                <input value="{{student.department}}" class="form-control"
                    style="background-color:rgb(229, 229, 229);color: #262626;font-weight: 450;font-family: Lexend;"
                    disabled>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">
                    <p
                        style="font-family: lexend; font-size: 1.5vh;font-weight: 700;margin-left: -0.3vh;margin-bottom: 1.3vh;">
                        Degree</p>
                </label>
                <input value="{{student.degree}}" class="form-control"
                    style="background-color:rgb(229, 229, 229);color: #262626;font-weight: 450;font-family: Lexend;"
                    disabled>
            </div>
            <div class="col-md-3 mb-3">
                <label class="form-label">
                    <p
                        style="font-family: lexend; font-size: 1.5vh;font-weight: 700;margin-left: -0.3vh;margin-bottom: 1.3vh;">
                        Status</p>
                </label>
                <select name="status" class="form-control"
                    style="background-color:rgb(229, 229, 229);color: #262626;font-weight: 450;font-family: Lexend;">
                    {% if student.status=="Approved" %}
                    <option value="Approved" selected>Approved</option>
                    <option value="Blacklisted">Blacklisted</option>
                    {% else %}
                    <option value="Approved">Approved</option>
                    <option value="Blacklisted" selected>Blacklisted</option>
                    {% endif %}
                </select>
            </div>
            <div style="display: flex;align-items: center; justify-content: space-evenly;">
                <div>
                    <a href="/student_list"><button type="button" class="btn btn-dark"
                            style="width: 50vh;height: 7vh;font-family: Lexend;font-weight: 600;font-size: 2.5vh;"><i class="bi bi-arrow-left"></i> Back</button></a>
                </div>
                <div>
                    <button type="submit" class="btn btn-dark"
                        style="width: 50vh;height: 7vh;font-family: Lexend;font-weight: 600;font-size: 2.5vh;">Update
                        Status</button>
                </div>
            </div>
        </form>
    </div>

    {% endblock %}
