<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Profile</title>
    <!--favicon css, fontapi -->
    <link rel="icon" href="/static/Images/fevicon.png">
    <link rel="stylesheet" href="/static/login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">
    <!-- bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body style="background-color: white;">
    <a href="/" style="text-decoration: none;">
    <div class="backbutton"
        style="display: flex;justify-content: center;align-items: center; font-family: lexend;font-size: 1.7vh;font-weight: 400; height: 4vh; width: 9vh; background-color: #181818; color: #ffffff; position: absolute;top: 7vh;left: 9vh; border-radius: 1vh;">
        Back</div>
</a>
    <div class="main_site">
        <form method="post">
        <div class="main" style="background-color: rgb(246, 243, 243); color: #181818; box-shadow: 0vh 0vh 0.2vh 0vh #181818; height: 40vh;">
            <div class="logo" style="margin-bottom: 4vh;">
                <p class="logo" style="font-weight: 600; margin-top: -2vh;">Sign Up</p>
            </div>
            <div class="lists">
                <div class="semibox" style="margin-top: -1.7vh;">
                    <p class="title">Choose your profile</p>
                    <select name="designation" id="designation" class="field" style="background-color: rgb(229, 229, 229); color: #181818; font-weight: 400;">
                        <option name="student" value="student" selected>Student</option>
                        <option name="recruiter" value="recruiter">Recruiter</option>
                    </select>
                </div>
            <div class="submit viewbutton">
                <button class="press" style= "display: flex; justify-self: center; justify-content: center; align-items: center; background-color: #181818; color: #fafafa;">Confirm</button>
            </div>
        </div>
        </form>
    </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
    integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
    crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
    integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
    crossorigin="anonymous"></script>

</html>
